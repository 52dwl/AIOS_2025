nodes:
  - id: terminal-input
    build: pip install -e ../../node-hub/terminal-input
    path: dynamic
    outputs:
      - data
    inputs:
      agent_response: pc-helper-agent/am_result
  - id: pc-helper-agent
    build: pip install -e ../../agent-hub/pc-helper
    path: pc-helper
    outputs:
      - am_result
    inputs:
      user_input: terminal-input/data
    env:
      IS_DATAFLOW_END: true
      WRITE_LOG: true