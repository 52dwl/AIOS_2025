agent:
  vector_store:
    provider: chroma
    config:
      path: db
  llm:
    provider: deepseek
    config:
      api_key: ${LLM_API_KEY}
      model: deepseek-chat
      temperature: 0.2
      max_tokens: 2000
      top_p: 1.0
  embedder:
    provider: ollama
    config:
      model: nomic-embed-text:v1.5
      ollama_base_url: http://localhost:11434
  history_db_path: ./mem0_history.db